name: daily-retrain

on:
  schedule:
    - cron: '0 8 * * 0'   # weekly: Sunday ~3am US Central
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install torch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: install deps
        run: pip install -r requirements.txt

      - name: refresh daily data
        run: python refresh_data.py

      - name: refresh NRCS soil/snow data
        run: python refresh_nrcs.py
        env:
          HYDROTWIN_PROJ: .

      - name: train neural models (9-feature: USGS + soil + snow)
        run: python train_export.py
        env:
          HYDROTWIN_NRCS_XLSX: ./data/nrcs_export.xlsx

      - name: export ONNX
        run: python export_onnx.py --out onnx
        env:
          HYDROTWIN_NRCS_XLSX: ./data/nrcs_export.xlsx

      - name: export ARIMA/SARIMA/GP params (fixed hyperparams, no grid)
        run: python export_params.py
        env:
          HYDROTWIN_PROJ: .
          HYDROTWIN_PARAMS_OUT: ./params_out
          HYDROTWIN_HYPER: ./classical_hyper.json

      - name: stage Pages content (preserve /onnx and /params URL prefixes)
        run: |
          mkdir -p pages
          cp -r onnx pages/onnx
          cp -r params_out pages/params
          printf '<html><body><h1>HydroTwin model server</h1><p>ONNX models + ARIMA/SARIMA/GP params, refreshed weekly.</p></body></html>' > pages/index.html

      - name: publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages

      - name: commit refreshed data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/daily data/nrcs_daily.csv
          git commit -m "daily data refresh $(date +%F)" || true
          git push
